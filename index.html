<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Something for Max</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap">
<style>
/* standalone page basics */
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one full-bleed twilight garden. Five scenes cross-fade through a bloom of light; glass cards hold the words, the flowers do the talking. Single deliberate look, so every color is explicit. */
:root{
  --plum-900:#2c0f31;
  --plum-700:#5b2058;
  --rose-500:#9b3f6c;
  --rose-400:#d9708f;
  --blush:#ffd3df;
  --cream:#fff6f3;
  --ruby:#c8344f;
  --font-script:'Pinyon Script','Snell Roundhand','Brush Script MT',cursive;
  --font-serif:'Cormorant Garamond','Palatino Linotype',Georgia,serif;
  --font-sans:'Jost','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--plum-900)}
body{height:100%;margin:0;position:relative;overflow:hidden;background:var(--plum-900);color:var(--cream);font-family:var(--font-sans);font-weight:300;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

/* ---------- atmosphere ---------- */
.sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#2c0f31 0%,#5b2058 32%,#9b3f6c 64%,#d9708f 100%)}
.rays{position:fixed;left:-10%;right:-10%;top:-10%;height:110vh;z-index:0;pointer-events:none;background:conic-gradient(from 150deg at 50% 0%,transparent 0deg,rgba(255,214,232,.12) 8deg,transparent 17deg,transparent 26deg,rgba(255,214,232,.09) 35deg,transparent 45deg,transparent 54deg,rgba(255,214,232,.11) 62deg,transparent 72deg,transparent 360deg);filter:blur(8px);animation:raysway 16s ease-in-out infinite alternate}
.dawn{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 75% 34% at 50% 108%,rgba(255,226,235,.85),rgba(255,170,200,.35) 50%,transparent 80%);opacity:.35;transition:opacity 1.8s ease}
body[data-scene="1"] .dawn{opacity:.9}
body[data-scene="2"] .dawn{opacity:.5}
body[data-scene="3"] .dawn{opacity:.8}
.orbs,.sparkles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.7),rgba(255,176,208,.28) 45%,transparent 70%);filter:blur(2px);animation:drift ease-in-out infinite alternate}
.sparkles i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,200,225,.9);opacity:0;animation:twinkle var(--t,4s) ease-in-out infinite}
.hills{position:fixed;left:0;right:0;bottom:0;height:24vh;z-index:1;pointer-events:none;overflow:hidden}
.hills i{position:absolute;border-radius:50%}
.hills i:nth-child(1){left:-20%;width:90%;height:34vh;bottom:-18vh;background:radial-gradient(ellipse at 50% 0%,#4a8a62,#1f4a38 72%)}
.hills i:nth-child(2){right:-25%;width:95%;height:40vh;bottom:-24vh;background:radial-gradient(ellipse at 50% 0%,#5a9a70,#27553f 72%)}
.hills::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,190,215,.28),transparent 70%)}
.veil{position:fixed;left:50%;top:55%;width:140vmax;height:140vmax;margin:-70vmax 0 0 -70vmax;border-radius:50%;z-index:15;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,238,244,.96) 0,rgba(255,176,205,.55) 34%,transparent 64%)}
.veil.go{animation:veilgo 1.4s ease-in-out}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}

/* ---------- scenes ---------- */
.scene{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;text-align:center;overflow-x:hidden;overflow-y:auto;padding-block:clamp(68px,10vh,104px) clamp(40px,7vh,72px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);filter:blur(8px);transition:opacity .9s ease,transform .9s ease,filter .9s ease,visibility 0s .9s}
.scene.past{transform:translateY(-16px) scale(1.01)}
.scene.active{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:.35s,.35s,.35s,0s}
.stage{margin:auto;width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vh,24px);min-width:0}

/* ---------- type ---------- */
.script{font-family:var(--font-script);font-weight:400;text-shadow:0 0 18px rgba(255,170,205,.65)}
.title{margin:0;font-family:var(--font-script);font-weight:400;font-size:clamp(3.1rem,12vw,6.4rem);line-height:1.04;text-wrap:balance;color:#fff;animation:titleglow 4.5s ease-in-out infinite alternate}
.lede{margin:0;font-family:var(--font-serif);font-style:italic;font-weight:500;font-size:clamp(1.25rem,4.4vw,1.75rem);color:var(--blush);text-wrap:balance}
.tiny{margin:0;font-size:.82rem;letter-spacing:.03em;color:var(--blush);opacity:.85;max-width:34ch;text-wrap:balance}
.h2{margin:0;font-family:var(--font-script);font-weight:400;font-size:clamp(2.7rem,9.5vw,4.6rem);line-height:1.05;text-wrap:balance;text-shadow:0 0 20px rgba(255,170,205,.7),0 0 46px rgba(255,120,170,.4)}
.sub{margin:0;font-family:var(--font-serif);font-style:italic;font-weight:500;font-size:clamp(1.15rem,3.8vw,1.45rem);color:var(--blush);text-wrap:balance}
.kicker{margin:0;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1}
.quote{margin:0;font-family:var(--font-serif);font-style:italic;font-weight:500;font-size:clamp(1.3rem,4.5vw,1.95rem);line-height:1.5;color:#fff;text-wrap:pretty}
.quote.big{font-size:clamp(1.5rem,5.4vw,2.4rem);line-height:1.4;text-shadow:0 0 18px rgba(255,170,205,.55)}

.w{display:inline-block;opacity:0;animation:wordin 1.1s ease forwards;animation-delay:calc(var(--i,0)*.16s + var(--base,.2s))}
.title .w{--base:.4s}
.fadeup{opacity:0;animation:fadeup 1.1s ease forwards;animation-delay:var(--fd,1.8s)}
.pop{animation:fadeup .9s ease both}

/* ---------- glass + buttons ---------- */
.glass{background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.04)),rgba(52,14,52,.36);border:1px solid rgba(255,255,255,.3);border-radius:28px;-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 24px 64px rgba(36,4,38,.42),inset 0 1px 0 rgba(255,255,255,.38)}
.card{width:min(100%,640px);padding:clamp(26px,5.5vw,50px);display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vh,26px)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:52px;padding:.95rem 1.9rem;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:linear-gradient(135deg,#cf3a67,#a01d3c);color:#fff;font-weight:500;font-size:1.04rem;letter-spacing:.04em;cursor:pointer;box-shadow:0 0 18px 2px rgba(255,140,180,.45),0 10px 28px rgba(160,30,70,.45);animation:btnglow 2.8s ease-in-out infinite alternate;transition:transform .3s ease,filter .3s ease,opacity .5s ease}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.42) 50%,transparent 70%);transform:translateX(-130%);animation:shine 4.4s ease-in-out infinite;pointer-events:none}
.btn:hover{transform:translateY(-3px) scale(1.035);filter:brightness(1.1)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.big{font-size:1.15rem;padding:1.1rem 2.2rem}
.btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.55);box-shadow:0 0 18px rgba(255,190,215,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn[disabled]{cursor:default;animation:none;opacity:.65;transform:none;filter:none}
.btn.gone{opacity:0;transform:scale(.9);pointer-events:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---------- sound + progress ---------- */
.sound{position:fixed;z-index:30;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(52,14,52,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;color:#fff;transition:transform .3s ease,box-shadow .3s ease}
.sound:hover{transform:scale(1.08);box-shadow:0 0 22px 4px rgba(255,160,195,.6)}
.sound svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sound .waves{display:none}
.sound.on .waves{display:inline}
.sound.on .slash{display:none}
.sound.on{box-shadow:0 0 18px 3px rgba(255,160,195,.55)}
.dots{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(33px + env(safe-area-inset-top,0px));display:flex;gap:10px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.38);transition:all .5s ease}
.dots i.on{background:#fff;transform:scale(1.3);box-shadow:0 0 10px 3px rgba(255,170,205,.9)}

/* ---------- flowers ---------- */
.bloomable{--k:0}
.bloomable.open{--k:1}
.bloomable .p{transform:rotate(calc(var(--a,0deg) - (1 - var(--k))*26deg)) scale(calc(var(--c,.2) + (var(--s,1) - var(--c,.2))*var(--k)));transform-origin:0 0;transition:transform 1.9s cubic-bezier(.2,1,.3,1.12) var(--d,0ms)}
.bloomable .lf{transform:rotate(var(--a,0deg)) scale(calc(.35 + .65*var(--k)));transform-origin:0 0;transition:transform 2s cubic-bezier(.2,1,.3,1.1) var(--d,0ms)}
.bloomable.reset .p,.bloomable.reset .lf{transition:none}
.emblem{width:clamp(88px,19vw,124px);aspect-ratio:1;filter:drop-shadow(0 0 22px rgba(255,150,190,.85));animation:floaty 5s ease-in-out infinite alternate}
.emblem svg{width:100%;height:100%;display:block;overflow:visible}

.garden{padding-bottom:0}
.garden .top{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px);padding-bottom:clamp(8px,2vh,20px)}
.plants{--stemMax:min(38vh,330px);margin-top:auto;width:100%;display:flex;align-items:flex-end;justify-content:center}
@supports (height:1svh){.plants{--stemMax:min(38svh,330px)}}
.plants .p{transition-delay:calc(var(--d,0ms) + var(--sd,0s))}
.plant{position:relative;display:flex;flex-direction:column;align-items:center;margin-inline:calc(var(--head)*-.04);transform-origin:50% 100%}
.plant.rose{--head:clamp(54px,15vw,136px)}
.plant.lily{--head:clamp(72px,20vw,176px)}
.head{position:relative;z-index:2;width:var(--head);height:var(--head);margin-bottom:calc(var(--head)*-.5);filter:drop-shadow(0 8px 12px rgba(60,0,40,.35)) drop-shadow(0 0 16px rgba(255,170,200,.35))}
.head svg{display:block;width:100%;height:100%;overflow:visible}
.plants:not(.open) .head{animation:budpulse 3.2s ease-in-out infinite alternate;animation-delay:var(--w,0s)}
.stem{position:relative;z-index:1;width:clamp(4px,.6vw,6px);height:calc(var(--f)*var(--stemMax)*(.36 + .64*var(--k)));border-radius:6px;background:linear-gradient(90deg,#2f6244,#6dae7e 45%,#2f6244);transition:height 2.4s cubic-bezier(.2,.9,.25,1) var(--sd,0s)}
.leaf{position:absolute;width:calc(var(--head)*.36);height:calc(var(--head)*.17);background:linear-gradient(130deg,#74b98a,#2f6a48);opacity:var(--k);transition:transform 2.2s cubic-bezier(.2,.9,.3,1.1) calc(var(--sd,0s) + .8s),opacity 1s ease calc(var(--sd,0s) + .8s)}
.leaf.l{right:50%;border-radius:100% 0 100% 0;transform-origin:100% 100%;bottom:var(--lb1,24%);transform:rotate(26deg) scale(calc(.2 + .8*var(--k)))}
.leaf.r{left:50%;border-radius:0 100% 0 100%;transform-origin:0 100%;bottom:var(--lb2,44%);transform:rotate(-26deg) scale(calc(.2 + .8*var(--k)))}
.plants.open .plant{animation:plantsway 5.5s ease-in-out infinite alternate;animation-delay:calc(2.6s + var(--w,0s))}
@media (max-width:1100px){.plant.opt{display:none}}

/* ---------- message + surprise ---------- */
.heart{width:clamp(70px,16vw,96px);filter:drop-shadow(0 0 22px rgba(255,120,170,.9));animation:beat 1.8s ease-in-out infinite}
.heart.burst{animation:heartburst 1.4s ease-out forwards}
.reveal{width:min(100%,700px);padding:clamp(26px,5.5vw,48px);display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vh,26px);opacity:0;transform:translateY(14px) scale(.98);transition:opacity 1s ease,transform 1s ease}
.reveal.show{opacity:1;transform:none}

/* ---------- final bouquet ---------- */
.bouquet-wrap{position:relative;display:grid;place-items:center}
.halo{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,200,222,.6),rgba(255,150,190,.2) 45%,transparent 70%);filter:blur(10px);animation:halo 4.5s ease-in-out infinite alternate}
.bouquet{position:relative;display:block;height:min(44vh,430px);aspect-ratio:4/5;width:auto;max-width:84vw;overflow:visible;filter:drop-shadow(0 14px 22px rgba(50,0,40,.4));transition:opacity .45s ease}
@supports (height:1svh){.bouquet{height:min(44svh,430px)}}
.final{margin:0;padding:clamp(14px,3vw,22px) clamp(22px,5vw,38px);font-size:clamp(1.7rem,5.8vw,2.5rem);line-height:1.2;max-width:min(100%,600px);text-wrap:balance;border-radius:26px}

/* ---------- keyframes ---------- */
@keyframes wordin{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes titleglow{from{text-shadow:0 0 14px rgba(255,170,205,.7),0 0 36px rgba(255,120,170,.4)}to{text-shadow:0 0 22px rgba(255,200,225,.95),0 0 64px rgba(255,120,170,.65)}}
@keyframes btnglow{from{box-shadow:0 0 16px 2px rgba(255,140,180,.4),0 10px 26px rgba(160,30,70,.45)}to{box-shadow:0 0 34px 8px rgba(255,165,200,.72),0 12px 34px rgba(160,30,70,.5)}}
@keyframes shine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes floaty{from{transform:translateY(-6px) rotate(-3deg)}to{transform:translateY(6px) rotate(3deg)}}
@keyframes drift{to{transform:translate(var(--dx,30px),var(--dy,-30px)) scale(1.18)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.95;transform:scale(1.2)}}
@keyframes raysway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes veilgo{0%{opacity:0;transform:scale(.15)}45%{opacity:.95;transform:scale(1.3)}100%{opacity:0;transform:scale(2.6)}}
@keyframes blink{50%{opacity:0}}
@keyframes budpulse{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes plantsway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes heartburst{0%{transform:scale(1);opacity:1}35%{transform:scale(1.7)}100%{transform:scale(.7);opacity:.7}}
@keyframes halo{from{transform:scale(.94);opacity:.7}to{transform:scale(1.06);opacity:1}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<div class="sky"></div>
<div class="rays"></div>
<div class="dawn"></div>
<div class="orbs" id="orbs"></div>
<div class="sparkles" id="sparkles"></div>
<div class="hills"><i></i><i></i></div>
<div class="veil" id="veil"></div>

<button class="sound" id="soundBtn" type="button" aria-pressed="false" aria-label="Turn music on">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg>
</button>
<div class="dots" id="dots" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></div>

<main>
  <section class="scene active" id="s0" aria-label="A little something for Max">
    <div class="stage">
      <div class="emblem bloomable" id="emblem"></div>
      <h1 class="title"><span class="w" style="--i:0">A</span> <span class="w" style="--i:1">Little</span> <span class="w" style="--i:2">Something</span> <span class="w" style="--i:3">for</span> <span class="w" style="--i:4">Max</span></h1>
      <p class="lede fadeup" style="--fd:1.7s">Hey Max, I made something for you...</p>
      <div class="fadeup" style="--fd:2.2s"><button class="btn big" id="openBtn" type="button">Open your little surprise</button></div>
      <p class="tiny fadeup" style="--fd:2.7s">Soft music is optional. Tap the speaker in the corner if you would like it.</p>
    </div>
  </section>

  <section class="scene garden" id="s1" aria-label="A garden for you" inert>
    <div class="top">
      <h2 class="h2">A garden for you</h2>
      <p class="sub">Every flower here was picked with you in mind, Max.</p>
      <div class="actions">
        <button class="btn" id="bloomBtn" type="button">Make the flowers bloom</button>
        <button class="btn ghost" id="toMsgBtn" type="button" hidden>Walk a little further</button>
      </div>
    </div>
    <div class="plants bloomable" id="plants"></div>
  </section>

  <section class="scene" id="s3" aria-label="The surprise" inert>
    <div class="stage">
      <svg class="heart" id="heart" viewBox="0 0 100 90" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb8cf"/><stop offset="1" stop-color="#e0456f"/></linearGradient></defs><path d="M50 84C10 56 6 28 24 14C36 5 48 12 50 24C52 12 64 5 76 14C94 28 90 56 50 84Z" fill="url(#hg)"/></svg>
      <p class="script kicker">The surprise</p>
      <button class="btn big" id="surpriseBtn" type="button">I have one more surprise...</button>
      <div class="glass reveal" id="reveal" hidden>
        <p class="quote big" id="quote"></p>
        <button class="btn ghost" id="toFinalBtn" type="button" hidden>Continue</button>
      </div>
    </div>
  </section>

  <section class="scene" id="s4" aria-label="Made for Max" inert>
    <div class="stage">
      <div class="bouquet-wrap"><div class="halo"></div><svg class="bouquet bloomable" id="bouquet" viewBox="0 0 400 500" role="img" aria-label="A bouquet of pink roses and white lilies"></svg></div>
      <p class="glass final script">Made with a little extra thought, just for Max.</p>
      <button class="btn" id="againBtn" type="button">One more time</button>
    </div>
  </section>
</main>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
'use strict';
var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function rng(seed){var s=((seed*2654435761)>>>0)||1;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}

/* ================= flower artwork ================= */
var ROSE={
  pink:{deep:'#9c2a5a',base:'#f27ba5',light:'#ffc6d8',rim:'#ffe6ee'},
  white:{deep:'#d38aa4',base:'#fff1f4',light:'#ffffff',rim:'#ffffff'},
  red:{deep:'#5e0b22',base:'#c9304e',light:'#f27c92',rim:'#ffb6c3'}
};
function defsMarkup(){
  var s='',k,c;
  for(k in ROSE){c=ROSE[k];
    s+='<linearGradient id="rg-'+k+'" gradientUnits="userSpaceOnUse" x1="0" y1="2" x2="0" y2="-76"><stop offset="0" stop-color="'+c.deep+'"/><stop offset=".42" stop-color="'+c.base+'"/><stop offset="1" stop-color="'+c.light+'"/></linearGradient>';
    s+='<radialGradient id="rc-'+k+'" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="14"><stop offset="0" stop-color="'+c.deep+'"/><stop offset="1" stop-color="'+c.base+'"/></radialGradient>';
  }
  s+='<radialGradient id="rshade" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="46"><stop offset="0" stop-color="#3a0016" stop-opacity=".5"/><stop offset="1" stop-color="#3a0016" stop-opacity="0"/></radialGradient>';
  s+='<linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-113"><stop offset="0" stop-color="#d9e48a"/><stop offset=".2" stop-color="#fffcec"/><stop offset=".7" stop-color="#ffffff"/><stop offset="1" stop-color="#fbdce7"/></linearGradient>';
  s+='<radialGradient id="lthroat" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="22"><stop offset="0" stop-color="#e3ea8c" stop-opacity=".95"/><stop offset="1" stop-color="#e3ea8c" stop-opacity="0"/></radialGradient>';
  s+='<linearGradient id="leafg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f6a48"/><stop offset="1" stop-color="#7cc08e"/></linearGradient>';

      padNote(BASS[b],t,eighth*8+.8,.035);
    }
    if((s===0||s===4)&&Math.random()<.55)boxNote(BARS[b][(s+3)%8]+12,t+eighth*.5,2.6,.05);
    music.next+=eighth;music.step++;
    if(music.step>=8){music.step=0;music.bar++}
  }
}
var soundBtn=$('#soundBtn');
function setMusic(on){
  if(on){
    if(!music.ctx&&!buildAudio())return;
    music.on=true;music.ctx.resume();
    music.master.gain.cancelScheduledValues(music.ctx.currentTime);
    music.master.gain.setTargetAtTime(.8,music.ctx.currentTime,.5);
    if(!music.timer){music.next=music.ctx.currentTime+.15;schedule();music.timer=setInterval(schedule,100)}
  }else if(music.ctx){
    music.on=false;
    music.master.gain.setTargetAtTime(0,music.ctx.currentTime,.25);
    setTimeout(function(){
      if(!music.on){clearInterval(music.timer);music.timer=null;music.ctx.suspend()}
    },1200);
  }
  soundBtn.classList.toggle('on',music.on);
  soundBtn.setAttribute('aria-pressed',music.on?'true':'false');
  soundBtn.setAttribute('aria-label',music.on?'Turn music off':'Turn music on');
}
soundBtn.addEventListener('click',function(){setMusic(!music.on)});

/* ================= scenes ================= */
var scenes=$$('.scene'),dots=$$('#dots i'),cur=0,busy=false,veil=$('#veil');
function apply(){
  scenes.forEach(function(s,i){s.classList.toggle('active',i===cur);s.classList.toggle('past',i<cur);s.inert=(i!==cur)});
  dots.forEach(function(d,i){d.classList.toggle('on',i===cur)});
  document.body.setAttribute('data-scene',String(cur));
}
function goTo(n){
  if(busy||n===cur)return;busy=true;
  if(!REDUCED){veil.classList.remove('go');void veil.offsetWidth;veil.classList.add('go')}
  setTimeout(function(){cur=n;apply();onEnter(n)},REDUCED?0:520);
  setTimeout(function(){busy=false;veil.classList.remove('go')},REDUCED?50:1500);
}
function focusMain(n){
  setTimeout(function(){
    var b=$('.btn:not([hidden]):not(.ghost)',scenes[n])||$('.btn:not([hidden])',scenes[n]);
    if(b&&!b.disabled)b.focus({preventScroll:true});
  },1100);
}
function onEnter(n){
  scenes[n].scrollTop=0;
  if(n===3)setTimeout(function(){$('#bouquet').classList.add('open');showerPetals(40,4,false)},900);
  focusMain(n);
}

/* intro */
setTimeout(function(){$('#emblem').classList.add('open')},500);
$('#openBtn').addEventListener('click',function(){showerPetals(40,2.4,true);goTo(1)});

/* garden */
var bloomBtn=$('#bloomBtn'),toMsgBtn=$('#toMsgBtn'),bloomed=false;
function bloom(){
  if(bloomed)return;bloomed=true;bloomBtn.disabled=true;
  plantsEl.classList.add('open');
  showerPetals(120,3.4,true);
  run(26,2.8,function(){
    var heads=$$('#plants .head'),h=heads[(Math.random()*heads.length)|0];
    if(!h||!h.offsetParent)return;
    var r=h.getBoundingClientRect();
    for(var i=0;i<3;i++)addSpark(r.left+r.width/2,r.top+r.height/2,r.width*.35);
  },.3);
  setTimeout(function(){bloomBtn.classList.add('gone')},300);
  setTimeout(function(){bloomBtn.hidden=true;toMsgBtn.hidden=false;toMsgBtn.classList.add('pop');toMsgBtn.focus({preventScroll:true})},REDUCED?400:2700);
}
bloomBtn.addEventListener('click',bloom);
toMsgBtn.addEventListener('click',function(){goTo(2)});

/* surprise */
var QUOTE="If I could send you a flower every time you crossed my mind, you’d have an entire garden by now.";
var surpriseBtn=$('#surpriseBtn'),reveal=$('#reveal'),toFinalBtn=$('#toFinalBtn'),heart=$('#heart'),shown=false;
surpriseBtn.addEventListener('click',function(){
  if(shown)return;shown=true;surpriseBtn.disabled=true;surpriseBtn.classList.add('gone');
  heart.classList.add('burst');
  risingHearts(46,3.8);risingBlooms(26,3.8);showerPetals(80,3.8,false);
  setTimeout(function(){
    surpriseBtn.hidden=true;
    var words=QUOTE.split(' ');
    $('#quote').innerHTML=words.map(function(w,i){return '<span class="w" style="--i:'+i+'">'+w+'</span>'}).join(' ');
    reveal.hidden=false;
    requestAnimationFrame(function(){requestAnimationFrame(function(){reveal.classList.add('show')})});
    risingHearts(16,4);
    setTimeout(function(){toFinalBtn.hidden=false;toFinalBtn.classList.add('pop');toFinalBtn.focus({preventScroll:true})},REDUCED?300:words.length*160+1600);
  },REDUCED?100:900);
});
toFinalBtn.addEventListener('click',function(){goTo(3)});

/* finale */
var bouquet=$('#bouquet'),againBtn=$('#againBtn');
againBtn.addEventListener('click',function(){
  againBtn.disabled=true;
  bouquet.style.opacity='0';
  setTimeout(function(){
    bouquet.classList.add('reset');bouquet.classList.remove('open');void bouquet.getBoundingClientRect();
    bouquet.classList.remove('reset');bouquet.style.opacity='1';
    setTimeout(function(){
      bouquet.classList.add('open');
      showerPetals(90,3.6,true);risingHearts(18,3.6);risingBlooms(10,3.6);
      againBtn.disabled=false;
    },REDUCED?0:550);
  },REDUCED?0:450);
});
})();
</script>
